name: Build

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b" # vcpkg baseline, keep in sync with vcpkg.json
  RUSTDESK_HS_VERSION: "0.1.0"

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux_amd64
            os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            os-name: linux
            arch: amd64
          - id: linux_386
            os: ubuntu-24.04
            rust-target: i686-unknown-linux-gnu
            os-name: linux
            arch: "386"
            cross: true
            cross-arch: i386
            cross-gcc: i686-linux-gnu-gcc
          - id: linux_arm64
            os: ubuntu-24.04-arm64
            rust-target: aarch64-unknown-linux-gnu
            os-name: linux
            arch: arm64
          - id: linux_arm
            # jammy fully publishes armhf in all pockets (noble does not for security/updates/backports).
            os: ubuntu-22.04
            rust-target: armv7-unknown-linux-gnueabihf
            os-name: linux
            arch: arm
            cross: true
            cross-arch: armhf
            cross-gcc: arm-linux-gnueabihf-gcc
          - id: windows_amd64
            os: windows-2022
            rust-target: x86_64-pc-windows-msvc
            os-name: windows
            arch: amd64
            vcpkg-triplet: x64-windows-static
          - id: windows_386
            os: windows-2022
            rust-target: i686-pc-windows-msvc
            os-name: windows
            arch: "386"
            vcpkg-triplet: x86-windows-static
          - id: windows_arm64
            os: windows-2022
            rust-target: aarch64-pc-windows-msvc
            os-name: windows
            arch: arm64
            vcpkg-triplet: arm64-windows-static
            sodium-lib-dir: true
          - id: darwin_amd64
            os: macos-13
            rust-target: x86_64-apple-darwin
            os-name: darwin
            arch: amd64
            vcpkg-triplet: x64-osx
          - id: darwin_arm64
            os: macos-14
            rust-target: aarch64-apple-darwin
            os-name: darwin
            arch: arm64
            vcpkg-triplet: arm64-osx

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # bindgen (used by magnum-opus etc.) needs libclang.
      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "16"

      - name: (Linux) install system prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get install -y \
            cmake gcc g++ clang nasm wget perl \
            libpam0g-dev libasound2-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libvdpau-dev \
            libx11-dev libxext-dev libxtst-dev libxfixes-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxkbcommon-dev libjpeg-turbo8-dev \
            libvpx-dev libaom-dev libopus-dev libyuv-dev \
            libdbus-1-dev libsystemd-dev libsndfile1-dev libmp3lame-dev liblzma-dev

      - name: (Linux) add cross-compile toolchain
        if: runner.os == 'Linux' && matrix.cross
        run: |
          CROSS_ARCH="${{ matrix.cross-arch }}"
          CROSS_GCC="${{ matrix.cross-gcc }}"
          GCC_PKG="gcc-${CROSS_GCC%-gcc}"
          GXX_PKG="g++-${CROSS_GCC%-gcc}"
          # armhf is only served from ports.ubuntu.com (archive/security.ubuntu.com have no armhf at all).
          if [ "${CROSS_ARCH}" == "armhf" ]; then
          # After dpkg --add-architecture armhf, apt also tries to fetch armhf indexes from the
          # runner's own amd64 sources, which 404. Restrict those sources to amd64 only.
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          for f in /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] && sudo sed -i 's/^deb /deb [arch=amd64] /' "$f"
          done
          sudo tee /etc/apt/sources.list.d/ports.list >/dev/null <<'EOF'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main universe
          EOF
          fi
          sudo dpkg --add-architecture "${CROSS_ARCH}"
          sudo apt-get -y update
          sudo apt-get install -y "${GCC_PKG}" "${GXX_PKG}"
          PKGS="libpam0g-dev libasound2-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libvdpau-dev \
            libx11-dev libxext-dev libxtst-dev libxfixes-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libjpeg-turbo8-dev \
            libvpx-dev libaom-dev libopus-dev libyuv-dev \
            libdbus-1-dev libsystemd-dev libsndfile1-dev libmp3lame-dev liblzma-dev"
          # Ubuntu 24.04: amd64/i386 dev packages share .gir files -> dpkg conflicts.
          # --force-overwrite lets libgudev-1.0-dev / libpango1.0-dev coexist (known bug).
          for pkg in $PKGS; do echo "${pkg}:${CROSS_ARCH}"; done | sudo xargs apt-get install -o Dpkg::Options::=--force-overwrite -y
          # Point the cc/ar crates (e.g. libsodium-sys) at the cross toolchain.
          TARGET_ENV="${{ matrix.rust-target }}"
          TARGET_ENV="${TARGET_ENV//-/_}"
          echo "CC_${TARGET_ENV}=${CROSS_GCC}" >> "$GITHUB_ENV"
          echo "AR_${TARGET_ENV}=${CROSS_GCC%-gcc}-ar" >> "$GITHUB_ENV"

      - name: (Linux) configure pkg-config for target
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" == "true" ]; then
            MULTIARCH="$(${{ matrix.cross-gcc }} -print-multiarch)"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/${MULTIARCH}/pkgconfig" >> "$GITHUB_ENV"
          else
            MULTIARCH="$(gcc -print-multiarch)"
          fi
          # Ubuntu's libyuv-dev does not ship libyuv.pc; generate one for this target.
          mkdir -p "$RUNNER_TEMP/ci-pc"
          cat > "$RUNNER_TEMP/ci-pc/libyuv.pc" <<EOF
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib/${MULTIARCH}
          includedir=\${prefix}/include

          Name: libyuv
          Description: libyuv
          Version: 0.0.0
          Libs: -L\${libdir} -lyuv
          Cflags: -I\${includedir}
          EOF
          echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/ci-pc" >> "$GITHUB_ENV"

      - name: (macOS) Install system prerequisites
        if: runner.os == 'macOS'
        run: brew install nasm yasm automake autoconf libtool

      # vcpkg provides the codec/system libs on Windows/macOS where there is
      # no system package manager. On Linux the crates use pkg-config instead,
      # so vcpkg is intentionally only set up for Windows/macOS.
      - name: (Windows/macOS) Setup vcpkg (cached)
        if: runner.os != 'Linux'
        uses: lukka/run-vcpkg@v11
        with:
          # /opt/artifacts is not writable on macOS runners; use runner.temp instead.
          vcpkgDirectory: ${{ runner.os == 'Windows' && 'C:\vcpkg' || format('{0}/vcpkg', runner.temp) }}
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: (Windows/macOS) Install vcpkg dependencies
        if: runner.os != 'Linux'
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.vcpkg-triplet }}
        run: |
          # run-vcpkg sets VCPKG_FORCE_SYSTEM_BINARIES=1 on arm64 hosts (macOS arm64
          # runners), which forces vcpkg onto the Homebrew system cmake (/opt/homebrew/bin/cmake)
          # and that segfaults in detect_compiler. Unset it so vcpkg uses its bundled
          # cmake/ninja instead (same path the passing x64 macOS job takes).
          unset VCPKG_FORCE_SYSTEM_BINARIES
          "$VCPKG_ROOT/vcpkg" install --triplet "${{ matrix.vcpkg-triplet }}" --x-install-root="$VCPKG_ROOT/installed"

      - name: Set SODIUM_LIB_DIR (Windows arm64)
        # libsodium-sys ships no arm64 Windows prebuilt lib; point it at the vcpkg-built one.
        if: runner.os == 'Windows' && matrix.sodium-lib-dir
        shell: bash
        run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-target }}

      - name: Build (release)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.rust-target }} --bin rustdesk-hs

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          EXE=""
          if [ "${{ matrix.os-name }}" == "windows" ]; then EXE=".exe"; fi
          NAME="rustdesk-hs_v${RUSTDESK_HS_VERSION}_${{ matrix.os-name }}_${{ matrix.arch }}"
          cp "target/${{ matrix.rust-target }}/release/rustdesk-hs${EXE}" "dist/${NAME}${EXE}"
          tar -czf "${NAME}.tar.gz" -C dist "${NAME}${EXE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-name }}-${{ matrix.arch }}
          path: rustdesk-hs_v${{ env.RUSTDESK_HS_VERSION }}_${{ matrix.os-name }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    # Only run when a repository release is created or on a tag push.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.run_id }}
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
